<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>uMLIP bench — campaign dashboard</title>
<style>
  :root{
    --bg:#0b0f1a; --panel:#141a2b; --panel2:#1b2336; --line:#26304a;
    --txt:#e6ecff; --muted:#8a96b4; --accent:#5b8cff;
    --green:#37d399; --amber:#ffc24b; --red:#ff6b6b; --violet:#a98bff;
  }
  *{box-sizing:border-box}
  body{margin:0;background:radial-gradient(1200px 600px at 80% -10%,#16203a 0%,var(--bg) 55%);
    color:var(--txt);font:14px/1.45 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Inter,'Noto Sans KR',Arial,sans-serif;
    -webkit-font-smoothing:antialiased;min-height:100vh}
  header{display:flex;align-items:center;gap:16px;flex-wrap:wrap;
    padding:18px 24px;border-bottom:1px solid var(--line);
    background:rgba(11,15,26,.7);backdrop-filter:blur(8px);position:sticky;top:0;z-index:5}
  .logo{font-size:20px;font-weight:700;letter-spacing:.3px;display:flex;align-items:center;gap:10px}
  .logo .dot{width:10px;height:10px;border-radius:50%;background:var(--green);box-shadow:0 0 12px var(--green)}
  .tabs{display:flex;gap:6px}
  .spacer{flex:1}
  .meta{color:var(--muted);font-size:12px;text-align:right}
  .btn{cursor:pointer;border:1px solid var(--line);background:var(--panel2);color:var(--txt);
    padding:7px 13px;border-radius:9px;font-size:12px}
  .btn:hover{border-color:var(--accent)}
  .btn.on{border-color:var(--accent);color:var(--accent);font-weight:600}
  .chips{display:flex;gap:12px;flex-wrap:wrap;padding:18px 24px 4px}
  .chip{background:linear-gradient(180deg,var(--panel2),var(--panel));border:1px solid var(--line);
    border-radius:14px;padding:13px 17px;min-width:130px;flex:1}
  .chip .k{color:var(--muted);font-size:11px;text-transform:uppercase;letter-spacing:.6px}
  .chip .v{font-size:23px;font-weight:700;margin-top:3px}
  .chip .v small{font-size:13px;color:var(--muted);font-weight:500}
  .grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(min(420px,100%),1fr));gap:16px;padding:18px 24px 40px}
  .grid.wide{grid-template-columns:1fr;max-width:1200px;margin:0 auto}
  .card{background:var(--panel);
    border:1px solid var(--line);border-radius:16px;overflow:hidden;display:flex;flex-direction:column}
  .card h2{margin:0;padding:13px 16px;font-size:15px;display:flex;align-items:center;gap:9px;
    border-bottom:1px solid var(--line);background:var(--panel2)}
  .card h2 .sdot{width:9px;height:9px;border-radius:50%;background:var(--green);box-shadow:0 0 9px var(--green);flex-shrink:0}
  .card h2 .sdot.busy{background:var(--accent);box-shadow:0 0 9px var(--accent)}
  .card h2 .host{color:var(--muted);font-weight:500;font-size:12px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .card h2 .cnt{margin-left:auto;color:var(--muted);font-size:12px;font-weight:500;flex-shrink:0}
  .gpu{padding:11px 16px;border-bottom:1px solid var(--line)}
  .gpu:last-child{border-bottom:none}
  .gpu .top{display:flex;align-items:center;gap:8px;margin-bottom:7px}
  .gpu .job{margin:-3px 0 7px 30px;font-size:11.5px;color:var(--accent,#7aa2f7);
    white-space:nowrap;overflow:hidden;text-overflow:ellipsis;opacity:.85}
  .gpu .idx{font-weight:700;color:var(--accent);font-size:12px;min-width:18px}
  .gpu .name{font-size:12px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .gpu .pill{margin-left:auto;display:flex;gap:6px;align-items:center;flex-shrink:0}
  .pill span{font-size:11px;color:var(--muted)}
  .pill b{font-size:11px;padding:2px 7px;border-radius:999px;background:var(--panel2);border:1px solid var(--line)}
  .bars{display:grid;grid-template-columns:1fr 1fr;gap:9px}
  .bar .lbl{display:flex;justify-content:space-between;font-size:11px;color:var(--muted);margin-bottom:3px}
  .bar .lbl b{color:var(--txt)}
  .track{height:8px;border-radius:6px;background:#0c1322;overflow:hidden;border:1px solid var(--line)}
  .fill{height:100%;border-radius:6px;transition:width .5s ease}
  .empty{color:var(--muted);font-size:11px;font-style:italic;margin-top:6px}
  .banner{display:none;margin:14px 24px 0;padding:11px 15px;border-radius:11px;
    background:rgba(255,107,107,.12);border:1px solid rgba(255,107,107,.4);color:#ffd0d0;font-size:13px}
  footer{color:var(--muted);font-size:11px;text-align:center;padding:0 0 30px}
  /* the whole-node strips (CPU/RAM, then disk), pinned under the cards */
  .hw{margin-top:auto}
  .cpu,.disk{padding:11px 16px 13px;border-top:1px solid var(--line)}
  .disk .lbl{display:flex;justify-content:space-between;font-size:11px;color:var(--muted);margin-bottom:6px}
  .disk .lbl b{color:var(--txt);font-variant-numeric:tabular-nums}
  .dbar{display:flex;height:15px;border-radius:7px;overflow:hidden;background:#0c1322;border:1px solid var(--line)}
  .dbar .seg{height:100%}
  /* experiments */
  .sec{padding:10px 16px 4px;font-size:11px;color:var(--muted);text-transform:uppercase;letter-spacing:.6px;font-weight:600}
  /* Every table lives in one of these. A card clips its overflow, so a table
     wider than the card is invisible rather than reachable -- which is what a
     phone always gets: 7 training columns do not fit 390 px. */
  .tw{overflow-x:auto;-webkit-overflow-scrolling:touch;overscroll-behavior-x:contain}
  .tw::-webkit-scrollbar{height:6px}
  .tw::-webkit-scrollbar-thumb{background:#2c3752;border-radius:3px}
  table{border-collapse:collapse;width:100%}
  th,td{padding:7px 10px;text-align:left;font-size:12px}
  thead th{color:var(--muted);font-weight:500;font-size:11px;border-bottom:1px solid var(--line)}
  tbody td{border-bottom:1px solid rgba(38,48,74,.5)}
  tbody tr:last-child td{border-bottom:none}
  td.model{font-family:ui-monospace,Menlo,monospace;font-size:12px;white-space:nowrap}
  .mcell{min-width:110px}
  .mcell .mtxt{display:flex;justify-content:space-between;align-items:baseline;font-size:11px;margin-bottom:3px}
  .mcell .mtxt b{font-variant-numeric:tabular-nums}
  .mcell .mtxt span{color:var(--muted);font-size:10px;margin-left:6px;white-space:nowrap}
  .st-done b{color:var(--green)} .st-running b{color:var(--accent)}
  .st-stale b{color:var(--amber)} .st-todo b{color:#3a4a6a}
  .rdot{display:inline-block;width:7px;height:7px;border-radius:50%;background:var(--accent);
    box-shadow:0 0 7px var(--accent);margin-right:4px;animation:pulse 1.6s infinite}
  @keyframes pulse{50%{opacity:.25}}
  /* a stalled measurement holds a card and writes nothing: amber, and it
     does not pulse -- the pulse is what says "moving" */
  .rdot.stl{background:var(--amber);box-shadow:0 0 7px var(--amber);animation:none}
  /* which card a measurement is on, under its tag. Same wide-only rule the
     training cells' node line follows: a phone column cannot hold a node
     alias, and the tag above it still carries the dot. */
  .erun{font-size:9.5px;color:var(--muted);white-space:nowrap;margin-top:3px;
    line-height:1.45;font-variant-numeric:tabular-nums}
  .erun.stl{color:var(--amber)}
  .tag{font-size:11px;padding:2px 9px;border-radius:999px;border:1px solid var(--line);
    background:var(--panel2);white-space:nowrap}
  .tag.done{color:var(--green);border-color:rgba(55,211,153,.4)}
  .tag.old{color:#63a888;border-color:rgba(55,211,153,.25)}
  .tag.partial{color:var(--amber);border-color:rgba(255,194,75,.4)}
  .tag.wait{color:#7f8fb3;border-color:rgba(127,143,179,.35)}
  .tag.todo{color:#3a4a6a}
  .lgnd{grid-column:1/-1;color:var(--muted);font-size:11.5px;line-height:1.7;
    padding:4px 8px}
  .part{padding:11px 16px 3px;font-size:13px;font-weight:700;color:var(--accent);
    letter-spacing:.4px;border-top:1px solid var(--line);margin-top:6px}
  .part:first-of-type{border-top:none;margin-top:0}
  th.grp{color:var(--txt);font-weight:600;border-bottom:none;padding-bottom:2px;
    font-size:11px;letter-spacing:.4px}
  a.paper{color:var(--muted);text-decoration:none;border-bottom:1px dotted var(--muted)}
  a.paper:hover{color:var(--accent);border-color:var(--accent)}
  /* result modals: clicking a cell or an observable column opens its plots */
  .clk{cursor:pointer}
  td.clk:hover{background:rgba(91,140,255,.07)}
  th.clk{text-decoration:underline dotted;text-underline-offset:3px}
  th.clk:hover,.sec.clk:hover{color:var(--accent)}
  #modal{position:fixed;inset:0;display:none;z-index:50;background:rgba(4,7,14,.66);backdrop-filter:blur(3px)}
  #modal .box{position:absolute;inset:3% 5%;overflow:auto;background:var(--panel);
    border:1px solid var(--line);border-radius:16px;padding:0 0 22px}
  #modal .mhead{position:sticky;top:0;display:flex;gap:14px;align-items:baseline;flex-wrap:wrap;
    padding:14px 18px;border-bottom:1px solid var(--line);background:var(--panel2);z-index:2}
  #modal .mhead h3{margin:0;font-size:15px;white-space:nowrap}
  #modal .mhead .sub{color:var(--muted);font-size:12px;flex:1;min-width:220px}
  .charts{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(380px,100%),1fr));gap:14px;padding:14px 18px 4px}
  .chartbox{background:var(--panel2);border:1px solid var(--line);border-radius:12px;padding:12px 12px 8px}
  .chartbox h4{margin:0 0 4px 8px;font-size:13.5px;color:var(--txt);font-weight:600}
  .chartbox svg{width:100%;height:auto;display:block}
  .lg{display:flex;flex-wrap:wrap;gap:4px 14px;padding:4px 8px 4px;font-size:12px;color:var(--muted)}
  .lg span{display:inline-flex;align-items:center;gap:6px;white-space:nowrap}
  .lg .sw{width:16px;height:0;border-top:2px solid}
  /* filter chips: the one selection mechanism for models and runs */
  .selbar{display:flex;flex-wrap:wrap;gap:6px;align-items:center;padding:12px 18px 0}
  .chipbtn{cursor:pointer;display:inline-flex;align-items:center;gap:7px;font-size:12.5px;
    padding:5px 12px;border-radius:999px;border:1px solid var(--line);background:var(--panel2);
    color:var(--muted);user-select:none;white-space:nowrap}
  .chipbtn i{width:9px;height:9px;border-radius:50%;background:#3a4a6a;flex-shrink:0}
  .chipbtn.on{color:var(--txt);border-color:#3d4f7c}
  .chipbtn:not(.on){opacity:.55}
  .chipbtn:not(.on) i{background:#3a4a6a !important}
  .chipbtn.ghost{border-style:dashed}
  .vr{width:1px;height:18px;background:var(--line);margin:0 4px}
  .qi{display:inline-flex;align-items:center;justify-content:center;width:17px;height:17px;
    border-radius:50%;border:1px solid var(--line);color:var(--muted);font-size:11px;
    cursor:help;flex-shrink:0;background:var(--panel2)}
  .qi:hover{color:var(--accent);border-color:var(--accent)}
  #modal .tw{margin:6px 18px 10px}
  #modal table{width:auto;min-width:55%}
  #modal td,#modal th{font-variant-numeric:tabular-nums;white-space:nowrap;
    font-size:12.5px;padding:8px 12px}
  #modal .note{color:var(--muted);font-size:11px;padding:0 18px 8px;line-height:1.5}
  #modal tr.refrow td{color:var(--txt);font-style:italic}
  #modal tbody tr.clk:hover td{background:rgba(91,140,255,.07)}
  .mdot{display:inline-block;width:8px;height:8px;border-radius:50%;margin-right:6px}
  #tip{position:fixed;display:none;z-index:60;background:#0c1322;border:1px solid var(--line);
    border-radius:8px;padding:7px 11px;font-size:12.5px;line-height:1.5;pointer-events:none;
    color:var(--txt);box-shadow:0 4px 16px rgba(0,0,0,.5);
    max-width:min(360px,86vw);white-space:pre-line}
  #tip b{font-variant-numeric:tabular-nums}
  /* chart controls: the two paper badges, per-chart buttons, the toolbar.
     `.badge` is the SOURCE study a benchmark reproduces and `.badge.own`
     this paper's own float -- two different claims, so two different inks.
     They can sit on one chart: Ti's dispersion is Roecken's Fig. 4 and our
     Figure~\ref{fig:offtarget}c both. */
  .badge{font-size:10px;padding:2px 8px;border-radius:999px;background:rgba(91,140,255,.13);
    border:1px solid rgba(91,140,255,.45);color:#9db8ff;font-weight:600;white-space:nowrap;flex-shrink:0}
  .badge.own{background:rgba(0,158,115,.14);border-color:rgba(0,158,115,.5);color:#5fd0ac}
  .cbar{display:flex;align-items:center;gap:7px;margin:0 4px 4px 8px}
  .cbar h4{margin:0;font-size:13.5px;color:var(--txt);font-weight:600;flex:1;min-width:0}
  .cbtn{cursor:pointer;font-size:10.5px;padding:2px 8px;border-radius:6px;border:1px solid var(--line);
    background:var(--panel);color:var(--muted);user-select:none;white-space:nowrap;flex-shrink:0}
  .cbtn:hover{border-color:var(--accent)}
  .cbtn.on{color:var(--accent);border-color:var(--accent)}
  .toolbar{display:flex;flex-wrap:wrap;gap:8px;align-items:center;padding:10px 18px 0;
    color:var(--muted);font-size:12px}
  .toolbar input[type=range]{width:120px;accent-color:var(--accent);margin:0 2px}
  .toolbar b{font-variant-numeric:tabular-nums;min-width:30px}
  .toolbar .tgrp{display:inline-flex;align-items:center;gap:6px;white-space:nowrap}
  th.sortable{cursor:pointer;user-select:none}
  th.sortable:hover{color:var(--accent)}
  /* ---------------------------------------------------------- phones ---- */
  /* The GPU tab already stacks; the experiment tab is the wide one. Its
     tables stay tables (a grid reads as a grid), shed the node column into
     the modal, and scroll sideways behind a pinned model name if they still
     do not fit. */
  @media(max-width:760px){
    header{padding:12px 14px;gap:10px}
    .logo{font-size:17px}
    .meta{font-size:11px;text-align:left}
    .chips{padding:12px 12px 2px;gap:8px}
    .chip{min-width:calc(50% - 6px);padding:11px 13px}
    .chip .v{font-size:20px}
    .grid{padding:12px 12px 28px;gap:12px}
    .banner{margin:12px 12px 0}
    .card h2{padding:11px 13px;font-size:14px;flex-wrap:wrap}
    .card h2 .host{order:3;flex:1 1 100%;margin-left:18px;white-space:normal}
    .card h2 .cnt{order:2}
    .part{padding:10px 13px 2px}
    .sec{padding:9px 13px 3px}
    th,td{padding:6px 4px}
    thead th{font-size:10px;white-space:nowrap}
    td.model{font-size:10px}
    /* the model name stays put while the rates and seeds scroll past it */
    td.model,thead th:first-child{position:sticky;left:0;z-index:1;
      background:var(--panel);box-shadow:1px 0 0 rgba(38,48,74,.7)}
    .mcell{min-width:0}
    /* epochs over age instead of beside it: six of these columns only fit a
       phone stacked */
    .mcell .mtxt{flex-direction:column;align-items:flex-start;font-size:10.5px;
      margin-bottom:2px;line-height:1.25}
    .mcell .mtxt span{margin-left:0;font-size:9.5px}
    .wo{display:none}          /* node name, "(winner)", "stalled": tap the cell */
    .gpu,.cpu,.disk{padding-left:13px;padding-right:13px}
    .qi{width:21px;height:21px;font-size:12px}
    #modal .box{inset:0;border-radius:0}
    #modal .mhead{padding:12px 13px;gap:10px}
    #modal .mhead h3{white-space:normal;font-size:14px}
    #modal .mhead .sub{min-width:0;flex:1 1 100%}
    #modal .tw{margin:6px 12px 10px}
    #modal td,#modal th{padding:7px 9px;font-size:11.5px}
    #modal .note{padding:0 13px 8px}
    .selbar{padding:10px 12px 0}
    .charts{padding:12px 12px 4px;gap:12px}
    .chartbox{padding:10px 8px 6px}
    .chartbox h4{font-size:12.5px;margin-left:4px}
    /* controls stay tappable: bigger hit targets, tighter chrome */
    .toolbar{padding:8px 12px 0;gap:6px}
    .toolbar input[type=range]{width:100px;height:22px}
    .cbar{margin:0 2px 4px 4px;gap:5px;flex-wrap:wrap}
    .cbar h4{flex:1 1 100%}
    .cbtn{padding:4px 10px;font-size:10.5px}
    .badge{font-size:9px;padding:2px 6px}
  }
  @media(max-width:520px){.bars{grid-template-columns:1fr}}
</style>
</head>
<body>
<header>
  <div class="logo"><span class="dot" id="hdot"></span>uMLIP bench</div>
  <div class="tabs">
    <button class="btn on" id="t-exp" onclick="tab('exp')">Experiments</button>
    <button class="btn" id="t-gpu" onclick="tab('gpu')">Hardware</button>
  </div>
  <div class="spacer"></div>
  <div class="meta" id="meta">connecting…</div>
  <button class="btn" onclick="load()">↻ Refresh</button>
  <span class="qi" title="Training: n/N epochs done, against the budget that cell owes (40, or 10 for a learning-rate probe) · amber = stalled 6+ h.&#10;Evaluation: ✓ done · n/N partial · — not started. A measurement in flight shows its node and card under its tag with how long since it last moved · amber = stalled 2+ h.&#10;&#10;Click a training cell, an evaluation cell, or an observable column header to open its plots and tables.&#10;&#10;The Paper card opens each figure and table of paper/main.tex, drawn the way the paper draws it from this machine's runs/.&#10;&#10;The paper's visual rules everywhere: COLOR is the model; pretrained is FADED and fine-tuned SOLID; a value per model is a pair of points in that model's column (gray = the DimeNet++ baseline); a curve comparison is one panel per model; learning rates keep dotted/solid/dashed; SEEDS are either folded into the mean with its standard deviation (band or error bar) or drawn with fading opacity (seed 0 opaque). The dashed ink-coloured series is always the measurement.&#10;&#10;In a plot view: chips select models and runs; clicking a line, point, bar or table row isolates it (click again to restore); the toolbar smooths curves and folds seeds; 🔍 zooms to a paper inset; 📘 marks the paper's own views, 📄 a plot the source paper reports, the rest are auxiliary views; column headers sort tables.">?</span>
</header>
<div class="banner" id="banner"></div>
<div class="chips" id="chips"></div>
<div class="grid wide" id="exp"></div>
<div class="grid" id="gpu" style="display:none"></div>
<footer id="footer"></footer>
<div id="modal"><div class="box" id="mbox"></div></div>
<div id="tip"></div>
<script>
// Replaced by publish_pages.sh on deploy; the placeholder means "served by
// dashboard.py, ask the collector directly".
const RAW_BASE='https://raw.githubusercontent.com/kiyoung98/umlip-dash/data';
const STATIC_MODE=RAW_BASE.indexOf('__')<0;
const REFRESH_MS=STATIC_MODE?60000:15000;
const srcUrl=()=>STATIC_MODE?RAW_BASE+'/state.json?t='+Date.now():'/api/state';
let cur='exp', last=null, failCount=0;
const GB=1024**3;
const esc=s=>String(s==null?'':s).replace(/[&<>]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;'}[c]));
// The rate columns lived here until 2026-08-29. The campaign stopped
// searching a rate and declares one per cell instead
// (infra/orchestrator/rates.py), so a training table is seeds alone; the
// declared rate reaches the page as the gate label on an unstarted seed
// (select.selection_status), which is where a reader now asks what a cell
// trains at.

function tab(t){cur=t;
  for(const x of ['exp','gpu']){
    document.getElementById(x).style.display=(x===t)?'':'none';
    document.getElementById('t-'+x).classList.toggle('on',x===t);}
  render();
}
function uColor(p){ if(p>=85)return'var(--red)'; if(p>=50)return'var(--amber)'; if(p>=10)return'var(--green)'; return'#3a4a6a'; }
function tColor(t){ if(t>=80)return'var(--red)'; if(t>=65)return'var(--amber)'; return'var(--green)'; }
function chip(k,v){return `<div class="chip"><div class="k">${k}</div><div class="v">${v}</div></div>`;}
function bar(label,val,max,txt,color){
  const pct=max?Math.min(100,val/max*100):0;
  return `<div class="bar"><div class="lbl"><span>${label}</span><b>${txt}</b></div>
    <div class="track"><div class="fill" style="width:${pct}%;background:${color}"></div></div></div>`;
}
function showBanner(m){const b=document.getElementById('banner');b.style.display='block';b.textContent=m;}
function hideBanner(){document.getElementById('banner').style.display='none';}
// Faults that "running" hides. The page drew a measurement as RUNNING beside
// a coverage of 0/N for three days in August 2026 and both were true: the
// joint arm's results were being deleted on arrival because no reader could
// resolve their tag, and the elastic cells were restarting from their first
// temperature every time they were re-dispatched. Neither is visible in any
// per-cell number -- the cell really is leased, and its coverage really is
// what it says -- so the join between them belongs here, at the top, in the
// one element the page already uses to say something is wrong.
function campaignFaults(s){
  const o=(s&&s.orchestrator)||{}, msg=[];
  // The collector's own errors come FIRST, because every number below them
  // is suspect while one is present. `expected-grid` is the one that hurts:
  // the grid is cached for an hour and the last good one is kept on failure,
  // so a payload that stopped parsing on 2026-08-29 left the page drawing a
  // retired lr-search grid for six hours, with no sign that anything was
  // wrong. A stale grid now says so where the reader is already looking.
  const errs=(s&&s.errors)||[];
  if(errs.length) msg.push(`collector: ${errs.join(' · ')} — the numbers `
    +`below are the last ones that could be built, not the current ones`);
  const bad=o.eval_uncountable||[];
  if(bad.length){
    msg.push(`${bad.length} training arm(s) whose evaluations can NEVER be `
      +`counted — every measurement they run is discarded on arrival: `
      +bad.map(b=>`${b.benchmark}/${b.method} (${b.why})`).join('; '));
  }
  const stuck=o.eval_stalled||[];
  if(stuck.length){
    const top=stuck.slice(0,4).map(d=>
      `${d.job} ${d.have}/${d.need} for ${d.stuck_h}h`
      +(d.node?` on ${d.node}`:'')).join('; ');
    msg.push(`${stuck.length} evaluation(s) leased repeatedly with no new `
      +`result — ${top}${stuck.length>4?'; …':''}`);
  }
  return msg.join(' · ');
}

// ------------------------------------------------------------------- gpu --
// A card running a MEASUREMENT says so in its job label -- the id's phase,
// which the label used to drop, so an evaluation read exactly like a
// training cell of the same method and model. Nothing else: a training cell
// on a card carries no progress badge either, and the experiment tab is
// where either kind of work says how it is doing.
function gpuRow(g){
  return `<div class="gpu">
    <div class="top">
      <span class="idx">${g.i}</span>
      <span class="name">${esc((g.name||'GPU').replace('NVIDIA ',''))}</span>
      <span class="pill">
        ${g.temp!=null?`<b style="color:${tColor(g.temp)}">${Math.round(g.temp)}°C</b>`:''}
        ${g.power!=null?`<span>${Math.round(g.power)}${g.plimit?'/'+Math.round(g.plimit):''}W</span>`:''}
      </span>
    </div>
    ${g.job?`<div class="job" title="${esc(g.job)}">${esc(g.job)}</div>`:''}
    <div class="bars">
      ${bar('Utilization',g.util,100,Math.round(g.util)+'%',uColor(g.util))}
      ${bar('Memory',g.mem,g.mem_total,(g.mem/1024).toFixed(1)+' / '+Math.round(g.mem_total/1024)+' GB',uColor(g.mem/g.mem_total*100))}
    </div>
  </div>`;
}
// ------------------------------------------------------------------- cpu --
// The other half of "is this box working", and the half no other view has: a
// dataloader that cannot feed the card, an MD driver pinned to one core and a
// box deep in swap all draw as an IDLE GPU above and as a healthy running
// cell on the experiments tab. Utilization is differenced between two probes
// by the collector, so it is blank for one cycle after a node appears -- the
// load average never is, and is shown either way.
function cpuBlock(c){
  if(!c||!c.cores) return '';
  const amber=t=>`<span style="color:var(--amber)">${t}</span>`;
  const load=c.load1!=null?`load ${c.load1.toFixed(1)}/${c.cores}`
    :`${c.cores} cores`;
  const flags=[];
  if(c.iowait>=5) flags.push(`io ${Math.round(c.iowait)}%`);
  if(c.steal>=5) flags.push(`steal ${Math.round(c.steal)}%`);
  // more runnable work than cores: every process on the box is now waiting
  // for a core, which is one of the ways a "running" cell stops moving
  const hot=c.load1!=null&&c.load1>c.cores*1.25;
  const ctxt=(c.util!=null?`${Math.round(c.util)}% · `:'')+(hot?amber(load):load)
    +(flags.length?' · '+amber(flags.join(' ')):'');
  const mu=c.mem_used||0, mt=c.mem_total||0, sw=c.swap_used||0;
  const mtxt=`${(mu/GB).toFixed(0)} / ${Math.round(mt/GB)} GB`
    +(sw>0.5*GB?' · '+amber(`swap ${(sw/GB).toFixed(1)} GB`):'');
  return `<div class="cpu" title="The whole node, not this campaign's share of it. On a rented container /proc is the HOST's, so a neighbour's load counts here too.">
    <div class="bars">
      ${bar('CPU',c.util||0,100,ctxt,uColor(c.util||0))}
      ${bar('RAM',mu,mt,mtxt,uColor(mt?mu/mt*100:0))}
    </div></div>`;
}
function diskBar(d){
  if(!d||!d.total) return '';
  const pct=d.used/d.total*100;
  const gb=x=>x>=1024**4?(x/1024**4).toFixed(2)+' TB':(x/1024**3).toFixed(1)+' GB';
  const color=pct>=90?'var(--red)':pct>=75?'var(--amber)':'var(--accent)';
  return `<div class="disk">
    <div class="lbl"><span>Disk</span><b>${pct.toFixed(0)}% full · ${gb(d.used)} / ${gb(d.total)}</b></div>
    <div class="dbar"><div class="seg" style="width:${pct.toFixed(2)}%;background:${color}"></div></div>
  </div>`;
}
function nodeCard(name,n,ts){
  const gpus=n.gpus||[];
  const busy=gpus.filter(g=>g.util>0||g.mem>500).length;
  return `<div class="card"><h2><span class="sdot${busy?' busy':''}"></span>${esc(name)}
    <span class="host">${busy}/${gpus.length} in use</span>
    <span class="cnt">${gpus.length} GPU${gpus.length!=1?'s':''}</span></h2>
    ${gpus.map(gpuRow).join('')||'<div class="empty" style="padding:16px">No GPUs reported</div>'}
    <div class="hw">${cpuBlock(n.cpu)}${diskBar(n.disk)}</div></div>`;
}
function renderGpu(s){
  const nodes=Object.entries(s.nodes).sort((a,b)=>a[0].localeCompare(b[0]));
  document.getElementById('gpu').innerHTML=
    nodes.map(([k,v])=>nodeCard(k,v,s.ts)).join('')
    ||'<div class="empty" style="padding:30px">no GPU nodes detected</div>';
}
function gpuChips(s){
  const nodes=Object.values(s.nodes);
  const gpus=nodes.flatMap(n=>n.gpus||[]);
  const used=gpus.filter(g=>g.util>0||g.mem>500).length;
  const avg=gpus.length?gpus.reduce((a,g)=>a+g.util,0)/gpus.length:0;
  const mu=gpus.reduce((a,g)=>a+g.mem,0), mt=gpus.reduce((a,g)=>a+g.mem_total,0);
  const kw=gpus.reduce((a,g)=>a+(g.power||0),0)/1000;
  const cpus=nodes.map(n=>n.cpu).filter(c=>c&&c.cores);
  const cores=cpus.reduce((a,c)=>a+c.cores,0);
  // Weighted by cores, over the nodes that HAVE a utilization (a node on its
  // first probe has none): a mean of percentages would let an 8-core box
  // outvote a 64-core one, and counting an unknown as 0% would report the
  // fleet as idling every time a node reappears.
  const seen=cpus.filter(c=>c.util!=null);
  const cc=seen.reduce((a,c)=>a+c.cores,0);
  const cbusy=seen.reduce((a,c)=>a+c.util/100*c.cores,0);
  const ru=cpus.reduce((a,c)=>a+(c.mem_used||0),0);
  const rt=cpus.reduce((a,c)=>a+(c.mem_total||0),0);
  return chip('Servers',`${nodes.length}<small> online</small>`)+
    chip('GPUs in use',`${used}<small>/${gpus.length}</small>`)+
    chip('Avg utilization',`${Math.round(avg)}<small>%</small>`)+
    chip('VRAM allocated',`${Math.round(mu/1024)}<small>/${Math.round(mt/1024)} GB</small>`)+
    chip('Power draw',`${kw.toFixed(1)}<small> kW</small>`)+
    chip('CPU busy',cc?`${Math.round(cbusy/cc*100)}<small>% of ${cores} cores</small>`
      :`—<small> of ${cores} cores</small>`)+
    chip('RAM used',`${Math.round(ru/GB)}<small>/${Math.round(rt/GB)} GB</small>`);
}

// ------------------------------------------------------------ experiments --
function age(h){return h==null?'':(h<1.5?Math.round(h*60)+'m':h.toFixed(1)+'h');}
function mcell(c,gate){
  if(!c||c.status==='todo')
    return `<div class="mcell st-todo"><div class="mtxt"><b>${gate?'⏳':'—'}</b>${gate?`<span>${esc(gate)}</span>`:''}</div>
      <div class="track"><div class="fill" style="width:0"></div></div></div>`;
  // epochs=null: show "running" without inventing a fraction
  const unknown=c.epochs==null;
  // the CELL's budget, not the campaign's: a rate probe owes ten epochs, and
  // drawing it against forty said "0/40" over a table headed "short run(s)",
  // which reads as a forty-something nobody has started.
  const bud=c.budget||40;
  const pct=unknown?0:Math.min(100,c.epochs/bud*100);
  const color={done:'var(--green)',running:'var(--accent)',stale:'var(--amber)'}[c.status];
  const txt=c.status==='done'?`✓ ${bud}`:unknown?'running':`${c.epochs}/${bud}`;
  // .wo = wide-only. A phone column is ~46 px: the node name cannot fit and
  // is one tap away in the panel, but the age is what says "is this moving".
  const tail=`${c.age_h!=null?age(c.age_h):''}${c.status==='stale'?'<span class="wo"> stalled</span>':''}`;
  const node=`${c.status==='running'?'<span class="rdot"></span>':''}${esc(c.node||'')}`;
  const sub=c.status==='done'?`<span class="wo">${esc(c.node||'')}</span>`:
    `<span class="wo">${node}${node&&tail?' ·':''}</span><span>${tail}</span>`;
  return `<div class="mcell st-${c.status}"><div class="mtxt"><b>${txt}</b><span>${sub}</span></div>
    <div class="track"><div class="fill" style="width:${pct}%;background:${color}"></div></div></div>`;
}
// Where a measurement is and whether it is moving, in the SAME three
// things a training cell shows (mcell): the node, how long since it last
// moved, and the word "stalled" in amber. `runs` is one entry per replicate
// in flight, because a row is one (model, observable, variant) and three
// seeds can be measured on three machines at once.
//
// A training cell's `age_h` is the time since its record was last written.
// This is the same quantity read off the only thing an evaluation writes
// before its npz -- the log on its node -- and it is drawn the same way,
// bare. A run whose log cannot be read shows the node and no age, exactly
// as a training cell with no record does.
function stalled(e){return ((e&&e.runs)||[]).some(r=>r.state==='stalled');}
function evalRuns(e){
  const rs=(e&&e.runs)||[];
  if(!rs.length) return '';
  return '<div class="wo">'+rs.map(r=>{
    const st=r.state==='stalled';
    const where=(r.node||'')+(r.gpu!=null?' g'+r.gpu:'');
    const tail=r.quiet_s==null?'':age(r.quiet_s/3600);
    return `<div class="erun${st?' stl':''}"><span class="rdot${st?' stl':''}"></span>`+
      `${r.seed!=null?'s'+r.seed+' ':''}${esc(where)}${tail?' · '+tail:''}`+
      `${st?' stalled':''}</div>`;}).join('')+'</div>';
}
function evalTag(e){
  if(!e) return '<span class="tag todo">—</span>';
  const run=e.running?`<span class="rdot${stalled(e)?' stl':''}"></span> `:'';
  if(e.status==='done') return `<span class="tag done">✓</span>`;
  if(e.seeds_ready!=null){
    // finetuned: the reported number is a mean over all seed replicates, so
    // the tag counts SEEDS — k/N replicates measured, or, before any eval
    // has landed, how many replicates have even finished training (each of
    // those is one measurement the scheduler owes right now).
    const tip=(e.per_seed||[]).map((h,i)=>`s${i}: ${h}/${e.need}`).join('  ');
    if(e.seeds_done||e.status==='partial'||e.running)
      return `<span class="tag partial" title="${tip}">${run}${e.seeds_done}/${e.n_seeds}s</span>`;
    if(e.seeds_ready)
      return `<span class="tag wait" title="${e.seeds_ready}/${e.n_seeds} seeds trained; eval owed">⏳ ${e.seeds_ready}/${e.n_seeds}</span>`;
    return '<span class="tag todo">—</span>';
  }
  if(e.status==='partial'||e.running) return `<span class="tag partial">${run}${e.have}/${e.need}</span>`;
  return '<span class="tag todo">—</span>';
}
function benchCard(b,models){
  const done=b.cells.filter(c=>c.status==='done').length;
  const run=b.cells.filter(c=>c.status==='running').length;
  const ref=b.paper
    ?(b.paper_url?`<a class="paper" href="${b.paper_url}" target="_blank" rel="noopener">${esc(b.paper)}</a>`:esc(b.paper))
    :'no source study';
  let h=`<div class="card"><h2><span class="sdot${run?' busy':''}"></span>${esc(TASK_LABEL[b.system]||b.display)}
    <span class="host">${ref}</span>
    <span class="cnt">${done}/${b.cells.length} done${run?' · '+run+' running':''}</span></h2>`;
  h+=`<div class="part">Training</div>`;
  for(const m of b.methods){
    const cells=b.cells.filter(c=>c.method===m);
    const tkey=`train:${b.system}:${m}`;
    // A method can own probes and no seed -- rates.PENDING is keyed
    // independently of System.methods(), so a calibration arm reaches the
    // page with probe cells only. Drawing the seed table for one would put
    // a grid of blanks on the page that reads as work owed, when nothing
    // will ever dispatch it: campaign.training_jobs builds the finetune
    // grid from methods() and this arm is deliberately not in it.
    const fts=cells.filter(c=>c.phase==='finetune');
    if(fts.length){
    h+=`<div class="sec clk" onclick="openPanel('${tkey}')" title="compare all models">fine-tuning · ${esc(armLabel(m))}</div>
      <div class="tw"><table><thead><tr><th>model</th>
      <th>seed 0</th><th>seed 1</th><th>seed 2</th></tr></thead><tbody>`;
    // a model-narrowed method (method_models) draws only its own rows
    const MM=(b.method_models&&b.method_models[m])||models;
    for(const model of MM){
      h+=`<tr><td class="model clk" onclick="openPanel('${tkey}',{model:'${model}'})">${esc(model)}</td>`;
      for(const sd of ['seed0','seed1','seed2']){
        const c=cells.find(x=>x.model===model&&x.label===sd&&x.phase==='finetune');
        const gate=(!c||c.status==='todo')?SEL[`${b.key}/${m}/${model}`]:null;
        h+=`<td class="clk" onclick="openPanel('${tkey}',{model:'${model}',variant:'${sd}'})">${mcell(c,gate)}</td>`;}
      h+=`</tr>`;
    }
    h+=`</tbody></table></div>`;
    }
    // The short runs a cell with no declared rate owes. They are counted in
    // the chips above like any other cell because the scheduler owes them
    // like any other cell, so they are drawn too -- a counted-but-undrawn
    // cell is how the page came to say 46/306 over a table of 153 rows.
    // The table is per method and appears only while something is undecided:
    // declaring the rate in rates.py deletes the row, not a person.
    const pr=cells.filter(c=>c.phase==='probe');
    if(pr.length){
      const labs=[...new Set(pr.map(c=>c.label))];
      // how short, in the header, because "short" is the whole reason these
      // cells are cheap and the reader should not have to hover a cell to
      // learn that the run below is ten epochs and not forty
      const bs=[...new Set(pr.map(c=>c.budget||40))];
      const ep=bs.length===1?` of ${bs[0]} epochs`:'';
      // "no rate declared yet" is only true for an arm the campaign
      // REPORTS, whose probe exists to choose its rate. An arm with no seed
      // is a calibration probe -- its rate is already decided and what the
      // grid varies is something else -- so the page must not say the rate
      // is missing. Read off the cells, not off a list of names here.
      let wh=fts.length?'learning-rate probe':'calibration probe';
      let wy=fts.length?'; no learning rate declared yet':'; not a reported strategy';
      // ...and the third kind, which the two above cannot express: a cell
      // that HAS a rate, is training three seeds at it right now, and is
      // buying a second opinion on it anyway (rates.REPROBE). Both captions
      // above would be false of it -- "no rate declared yet" flatly, and
      // "not a reported arm" of an arm that is the report. The rate it is
      // held at goes in the caption because that is the whole comparison:
      // these short runs mean nothing except against it.
      const rp=(b.reprobe||{})[m]||{};
      const pms=[...new Set(pr.map(c=>c.model))];
      const held=[...new Set(pms.map(x=>rp[x]).filter(Boolean))];
      // Only when EVERY row is one. A mixed section keeps the caption it
      // had -- true of the cells that have no rate -- and the rows carry
      // the rest, because one sentence cannot be right about both halves.
      if(held.length===1&&pms.every(x=>rp[x])){
        wh='learning-rate re-probe';
        wy=`; learning rate ${held[0]} stays declared and keeps training while these run`;
      }
      h+=`<div class="sec">${wh} · ${esc(armLabel(m))}<span class="wo"> (${pr.length} short run(s)${ep}${wy})</span></div>
        <div class="tw"><table><thead><tr><th>model</th>${labs.map(l=>`<th>${esc(l.replace(/^lr/,'learning rate ').replace('_dft',' · DFT ').replace('_wd',' · weight decay '))}</th>`).join('')}</tr></thead><tbody>`;
      for(const model of pms){
        // The held rate rides the ROW as well, so a mixed section (caption
        // unchanged, above) still says which cell already has one.
        const hd=rp[model]?`<span class="wo"> · holds learning rate ${esc(rp[model])}</span>`:'';
        h+=`<tr><td class="model">${esc(model)}${hd}</td>`;
        for(const l of labs){
          const c=pr.find(x=>x.model===model&&x.label===l);
          h+=`<td>${c?mcell(c):'<span style="color:var(--muted)">·</span>'}</td>`;}
        h+=`</tr>`;
      }
      h+=`</tbody></table></div>`;
    }
  }
  // Display names for observable columns. The KEY stays what the benchmark
  // declares (it is the campaign's column and this tree's path); only the
  // header text lives here, so renaming one costs nothing and moves no
  // result. 'liquid' draws diffusion alone since the ADF left 2026-09-03
  // and the RDF 2026-09-08 (docs/scope.md), and 'sq@ti-liquid' keeps its
  // target in the name because it sits inside ti-elastic's card, where a
  // bare 'sq' would read as an observable ti-elastic has of its own.
  const OBS_LABEL={elastic:'elastic constants',phonon:'phonon dispersion',
                   stress_strain:'stress–strain',liquid:'self-diffusion',
                   bcc:'bcc titanium',pressure:'lattice under pressure',
                   dft_test:'DFT test set',free_energy:'ΔG (hcp − bcc)',
                   boxes:'equilibrated cells',sq:'S(q)',melting:'melting',
                   'sq@ti-liquid':'liquid S(q)',
                   'elastic@diamond':'diamond (held-out composition)'};
  h+=`<div class="part">Evaluation</div>`;
  for(const v of (b.variants||['zs'])){
    // an ft variant of a model-narrowed method lists only its own models
    // ('exp' is exp_only's display alias; other variants share their
    // method's name)
    const vMeth=(v==='exp')?'exp_only':v;
    const vMM=(v!=='zs'&&b.method_models&&b.method_models[vMeth])||models;
    h+=`<div class="sec">${esc(varLabel(v))}</div><div class="tw"><table><thead>`;
    h+=`<tr><th>model</th>${b.observables.map(o=>`<th class="clk" title="all models, pretrained and fine-tuned" onclick="openPanel('eval:${b.system}:${o}')">${esc(OBS_LABEL[o]||o.replace(/^(\w+)@(.+)$/,(_,a,t)=>`${OBS_LABEL[a]||a} (${TASK_LABEL[t]||t})`))}</th>`).join('')}</tr></thead><tbody>`;
    for(const model of vMM){
      h+=`<tr><td class="model">${esc(model)}</td>`;
      for(const o of b.observables){
        const e=b.evals.find(x=>x.model===model&&x.obs===o&&x.variant===v);
        h+=`<td class="clk" onclick="openPanel('eval:${b.system}:${o}',{model:'${model}',variant:'${v}'})">${evalTag(e)}${evalRuns(e)}</td>`;}
      h+=`</tr>`;
    }
    h+=`</tbody></table></div>`;
  }
  h+=`</div>`;
  return h;
}
let SEL={};
function renderExp(s){
  SEL=(s.orchestrator&&s.orchestrator.selection)||{};
  if(!s.grid){document.getElementById('exp').innerHTML=
    '<div class="empty" style="padding:30px">first experiment scan in progress… (up to 2 min)</div>';return;}
  document.getElementById('exp').innerHTML=paperCard()+
    (s.grid.benchmarks||[]).map(b=>benchCard(b,s.grid.models)).join('');
}
// How the paper names the strategies and tasks (paper-style glossary),
// duplicated from gen_plotdata.arm_label and gen_plotdata.TASK with the
// equality test in tests/test_plot_json.py: the grid is drawn before the
// plot document arrives, so it cannot take them from there.
const ARM_LABEL={"exp_only": "Exp-Only", "fused": "DFT-Replay", "fused_pl": "PL-Replay", "l2sp1111": "L2-SP", "l2spwd139": "L2-SP (wd 139)", "l2spwd417": "L2-SP (wd 417)", "l2spwd3333": "L2-SP (wd 3333)", "l2spwd10000": "L2-SP (wd 10000)", "fusedb005": "DFT-Replay (5 batches)", "fusedb015": "DFT-Replay (15 batches)", "fusedb150": "DFT-Replay (150 batches)", "fusedb400": "DFT-Replay (400 batches)", "fusedplb005": "PL-Replay (5 batches)", "fusedplb015": "PL-Replay (15 batches)", "fusedplb150": "PL-Replay (150 batches)", "fusedplb400": "PL-Replay (400 batches)", "difttc": "Exp-Only"};
const TASK_LABEL={"diamond": "Diamond elastic task", "mgo": "MgO elastic task", "ti-elastic": "Titanium elastic task", "ti-phase": "Phase transition task", "ti-liquid": "Liquid structure factor task"};
const armLabel=m=>ARM_LABEL[m]||m;
const varLabel=v=>v==='zs'?'pretrained':'fine-tuned · '+armLabel(v==='exp'?'exp_only':v==='l2sp'?'l2sp1111':v);
// a seed family's name: its tag without the seed, else its strategy
const famName=o=>(o.tag&&/, seed \d+$/.test(o.tag))?o.tag.replace(/, seed \d+$/,''):armLabel(o.family||'');
// The paper's floats, one button each, in main.tex's order: a figure or
// table as the paper draws it, live from this machine's runs/ (gen_plotdata's

const PAPER_FLOATS=[

  ["fig:reg-tradeoff","Regularization trade-off"],
  ["fig:cubic-onT","Signed error per elastic constant"],
  ["fig:ti-elastic","Ti hcp elastic constants across temperature"],
  ["tab:tradeoff","Off-target error per strategy"],
  ["fig:offtarget","Off-target: bcc constants, phonons, liquid S(q)"],
  ["fig:training","Training loss and trajectory regenerations"]
];
function paperCard(){
  return `<div class="card"><h2><span class="sdot"></span>Paper
    <span class="host">figures and tables of paper/main.tex, drawn live from runs/</span></h2>
    <div style="display:flex;flex-wrap:wrap;gap:8px;padding:12px 16px 14px">${PAPER_FLOATS.map(([l,t])=>
      `<span class="chipbtn on" onclick="openPanel('paper:${l}')"><span class="badge own">📘 ${esc(l)}</span>${esc(t)}</span>`).join('')}</div></div>`;

function expChips(s){
  if(!s.grid) return '';
  const cells=(s.grid.benchmarks||[]).flatMap(x=>x.cells);
  const evals=(s.grid.benchmarks||[]).flatMap(x=>x.evals);
  const n=t=>cells.filter(c=>c.status===t).length;
  const edone=evals.filter(e=>e.status==='done').length;
  // one per RUNNING measurement, not per row: a row can have three
  // replicates in flight. The parallel of 'Training now'.
  const eruns=evals.flatMap(e=>e.runs||[]).length;
  return chip('Cells trained',`${n('done')}<small>/${cells.length}</small>`)+
    chip('Training now',`${n('running')}`)+
    chip('Stalled / not started',`${n('stale')}<small> / ${n('todo')}</small>`)+
    chip('Measuring now',`${eruns}`)+

// ------------------------------------------------------------------ plots --
// Per-cell result plots, derived by gen_plotdata.py on the collector under
// the same provenance rules as the paper. The style contract mirrors
// paper/gen_figures.py: colour identifies the model; every measured series
// is dashed in the page ink (the paper's black-dashed rule on a dark theme);
// pretrained faded, fine-tuned solid; a value per model is a pair of points
// (kind "points"), not a bar; rates keep the paper's dash styles.

function toggleBand(){BAND=!BAND;localStorage.band=BAND?'1':'0';renderModal();}

    const g=groups[k];

function aggSeedBars(bars){
  const groups={},out=[];

    if(b.seed==null){out.push(b);continue}
    const k=(b.model||'')+'|'+(b.family||b.tag);
    (groups[k]=groups[k]||[]).push(b);
  }
  for(const k in groups){
    const g=groups[k];
    if(g.length<2){out.push(...g);continue}
    const y=[],w=[];
    for(let i=0;i<g[0].y.length;i++){
      const vs=g.map(b=>b.y[i]).filter(v=>v!=null);
      if(!vs.length){y.push(null);w.push(null);continue}
      y.push(vs.reduce((a,b)=>a+b,0)/vs.length);
      w.push([Math.min(...vs),Math.max(...vs)]);

    out.push({...g[0],label:`${g[0].label.split(' · ')[0]} · ${famName(g[0])}, mean over ${g.length} seeds`,

// the PREVIOUS panel's charts under the new title -- which is how a page
// older than its plot document (2026-09-15: kind "points" reached the Pages
// feed before this renderer did) looked like "the plot does not open".
function chartBox(c,ci){
  let inner;
  try{inner=chartInner(c,ci)}
  catch(e){inner=`<div class="cbar"><h4>${esc(c.title||'')}</h4></div><div class="note" style="padding:18px 8px;color:#ffd0d0">this chart could not be drawn (${esc(e.message||e)}) — the page may be older than its data; reload</div>`}
  return `<div class="chartbox" data-ci="${ci}">${inner}</div>`;
}
// per-chart header: the title, a "paper" badge when the source paper shows
// this plot (everything untagged is this campaign's auxiliary view), a
// curve/bars flip where the generator allows one, a log toggle, and a ? for
// anything that needs more words than a title should carry
function chartCtl(c,ci){
  const st=CSTATE[ci]||{};
  let h='';
  if(c.ours)h+=`<span class="badge own" title="This paper draws this plot: \\ref{${attr(String(c.ours))}}. Charts without this badge are views the page adds and the paper does not print — the toolbar's &quot;paper views only&quot; hides them.">📘 ${esc(String(c.ours))}</span>`;
  if(c.paper)h+=`<span class="badge" title="This plot appears in the source study this task reproduces${c.paper===true?'':' ('+attr(String(c.paper))+')'}; that is a different claim from the green badge, which is this work's own float.">📄 source${c.paper===true?'':' · '+esc(String(c.paper))}</span>`;
  if(c.switch==='tail')h+=`<span class="cbtn${st.bar?' on':''}" onclick="cState(${ci},'bar')" title="Flip between the per-epoch curve and one bar per run at its final value (mean of the last 5 epochs — the quantity the learning-rate selection ranks).">${st.bar?'∿ curves':'▮ final bars'}</span>`;
  // zoom windows: the paper's insets (S(q)'s two peaks) as a toggle
  (c.views||[]).forEach((v,k)=>{h+=`<span class="cbtn${st.view===k?' on':''}" onclick="cView(${ci},${k})" title="Zoom to the window the paper's inset shows; click again for the whole curve.">🔍 ${esc(v.label)}</span>`});
  if(c.kind==='line'&&!st.bar&&!c.transpose)h+=`<span class="cbtn${(st.log!=null?st.log:!!c.logy)?' on':''}" onclick="cState(${ci},'log')" title="log / linear y axis">log</span>`;
  if(c.help)h+=`<span class="qi" title="${attr(c.help)}">?</span>`;
  return h;
}
function cView(ci,k){const st=CSTATE[ci]=CSTATE[ci]||{};st.view=st.view===k?null:k;renderModal();}
function chartInner(c,ci){
  const st=CSTATE[ci]||{};
  const cc=(st.bar&&c.switch==='tail')?tailBars(c):c;
  return `<div class="cbar"><h4>${esc(c.title||'')}</h4>${chartCtl(c,ci)}</div>`
    +(cc.kind==='bar'?barChart(cc,ci):cc.kind==='points'?pointsChart(cc,ci):lineChart(cc,ci,st))
    +(cc.kind==='points'?pointsLg(cc):staticLg(c));
}
// A cell is a string, or {t: text, v: sort value, shade: [better|worse,
// pct], tip}: the object form carries what a paper table prints
// ("0.157 → 0.024 (0.004)") with the number it sorts by -- the fine-tuned
// mean, not the first digits of the string -- and the tint the paper gives it.
const cellText=c=>c!=null&&typeof c==='object'?c.t:c;
function cellNum(r,k){
  const c=r.cells[k];
  if(c!=null&&typeof c==='object')return c.v!=null?c.v:null;
  const v=parseFloat(String(c||'').replace(/[^-+0-9.eE]/g,''));
  return isNaN(v)?null:v;
}
// gen_numbers.table_shades' \cellcolor{shadebetter!pct}: the paper's two
// hues (main.tex's \definecolor), scaled by the same pct of SHADE_MAX 40
function shadeCss(s){
  if(!s)return '';
  const rgb=s[0]==='better'?'0,114,178':'213,94,0';
  return `background:rgba(${rgb},${(0.1+0.5*s[1]/40).toFixed(3)})`;
}
function tableHtml(t,ti){
  if(!t)return '';
  ti=ti||0;
  const arrow=k=>TSORT&&TSORT.t===ti&&TSORT.c===k?(TSORT.d>0?' ↑':' ↓'):'';
  // The table is never filtered away, whatever the chart view: it is the
  // numbers. The badge says which of the paper's tables reads these same
  // records -- or, `exact`, that this IS that table, cell for cell.
  const btip=t.exact
    ?`This is the paper's \\ref{${attr(String(t.ours))}}, cell for cell: the text, the seed sd and the tint come from the same gen_numbers pass that writes numbers.tex, run on this machine's runs/.`
    :`The paper's \\ref{${attr(String(t.ours||''))}} is built from these records; its columns are the paper's, not this table's — the page prints the working quantities beside them.`;
  const cap=(t.ours||t.title)?`<div style="padding:12px 18px 0;display:flex;gap:9px;align-items:center;flex-wrap:wrap">`
    +(t.ours?`<span class="badge own" title="${btip}">📘 ${esc(String(t.ours))}</span>`:'')
    +(t.title?`<b style="font-size:13px">${esc(t.title)}</b>`:'')+`</div>`:'';
  let h=cap+`<div class="tw"><table><thead>`;
  if(t.head)h+=`<tr>${t.head.map(([l,n])=>`<th class="grp" colspan="${n}" style="text-align:center">${esc(l)}</th>`).join('')}</tr>`;
  h+=`<tr>${t.cols.map((x,k)=>
    `<th class="sortable" onclick="sortBy(${ti},${k})" title="sort">${esc(x)}${arrow(k)}</th>`).join('')}</tr></thead><tbody>`;
  // reference rows stay pinned in file order -- on top, or under the models
  // where the paper puts them (its DimeNet++ row); model rows sort
  const refs=[],data=[],tail=[];
  t.rows.forEach((r,i)=>{(r.model?data:r.pin==='bottom'?tail:refs).push([i,r])});
  if(TSORT&&TSORT.t===ti){
    const{c,d}=TSORT;
    data.sort((a,b)=>{
      const va=cellNum(a[1],c),vb=cellNum(b[1],c);
      if(va!=null&&vb!=null)return (va-vb)*d;
      if(va!=null)return -1; if(vb!=null)return 1;   // "-" sinks
      return String(cellText(a[1].cells[c])).localeCompare(String(cellText(b[1].cells[c])))*d;
    });
  }
  let shown=0;
  for(const[i,r]of refs.concat(data,tail)){
    if(r.model&&!visible(r))continue;
    shown++;
    const cls=[r.model?'clk':'refrow'].join(' ');
    h+=`<tr class="${cls}"${r.model?` onclick="rowSolo(${ti},${i})"`:''}>`;
    r.cells.forEach((cell,k)=>{
      const dot=k===0&&r.model?`<span class="mdot" style="background:${(plots&&plots.colors||{})[r.model]||'#8a96b4'}"></span>`:'';
      const o=cell!=null&&typeof cell==='object'?cell:null;
      h+=`<td${o&&o.shade?` style="${shadeCss(o.shade)}"`:''}${o&&o.tip?` title="${attr(o.tip)}"`:''}>${dot}${esc(cellText(cell))}</td>`;
    });
    h+='</tr>';
  }
  h+='</tbody></table></div>';
  if(t.caption)h+=`<div class="note">${esc(t.caption)}</div>`;
  return shown?h:'';
}
function sortBy(ti,c){TSORT=(TSORT&&TSORT.t===ti&&TSORT.c===c)?(TSORT.d<0?null:{t:ti,c,d:-1}):{t:ti,c,d:1};renderModal();}
function rowSolo(ti,i){solo((tablesOf(MPANEL)[ti]||{rows:[]}).rows[i]||null);}
function nearestItem(ci,e){
  const el=document.querySelector(`.chartbox[data-ci="${ci}"] svg`);
  const hv=HOVER[ci];
  if(!el||!hv)return null;
  const r=el.getBoundingClientRect();
  const vx=(e.clientX-r.left)/r.width*CW,vy=(e.clientY-r.top)/r.height*CH;
  if(hv.type==='bar'){
    for(const b of hv.rects)if(vx>=b.x&&vx<=b.x+b.w&&vy>=b.y0-8&&vy<=b.y1)return b;
    return null;
  }
  let best=null,bd=24*24;
  for(const p of hv.pts){const dx=p.px-vx,dy=p.py-vy,d=dx*dx+dy*dy;if(d<bd){bd=d;best=p}}
  return best;
}
// One tooltip, placed inside the viewport -- on a phone a raw clientX+14
// puts half of it off the right edge.
function showTip(html,x,y){
  const tip=document.getElementById('tip');
  tip.innerHTML=html;tip.style.display='block';
  tip.style.left='0px';tip.style.top='0px';
  const r=tip.getBoundingClientRect();
  tip.style.left=Math.max(8,Math.min(x,window.innerWidth-r.width-8))+'px';
  tip.style.top=Math.max(8,Math.min(y,window.innerHeight-r.height-8))+'px';
}
function hideTip(){document.getElementById('tip').style.display='none';}
// Every explanation on this page lives in a title="", which a touch device
// never shows. Tapping a ? renders the same text in the tooltip.
document.addEventListener('click',e=>{
  const q=e.target.closest&&e.target.closest('.qi');
  if(!q){hideTip();return}
  const r=q.getBoundingClientRect();
  showTip(esc(q.getAttribute('title')||''),r.left-260,r.bottom+8);
  e.stopPropagation();
},true);
function attachHover(ci){
  const el=document.querySelector(`.chartbox[data-ci="${ci}"] svg`);
  if(!el)return;
  el.style.cursor='pointer';
  el.addEventListener('mousemove',e=>{
    const best=nearestItem(ci,e);
    if(best)showTip(best.html?best.html:best.group!=null
        ?`${esc(best.label)}<br>${esc(best.group)} · <b>${fmtN(best.val)}</b>`
          +(best.whisker?`<br>seed range <b>${fmtN(best.whisker[0])}</b> – <b>${fmtN(best.whisker[1])}</b>`:'')
        :`${esc(best.label)}<br><b>${fmtN(best.x)}</b>, <b>${fmtN(best.y)}</b>`
          +(best.tip?`<br>${esc(best.tip)}`:''),
      e.clientX+14,e.clientY+10);
    else hideTip();
  });
  // click a line or bar to isolate that model+run; click it again to restore
  el.addEventListener('click',e=>{
    const best=nearestItem(ci,e);
    if(best&&(best.model||best.tag)){hideTip();solo(best)}
  });
  el.addEventListener('mouseleave',hideTip);
}

// ----------------------------------------------------------------- driver --
function render(){
  if(!last) return;
  document.getElementById('chips').innerHTML=cur==='gpu'?gpuChips(last):expChips(last);
  renderExp(last);renderGpu(last);
}
async function load(){
  try{
    const r=await fetch(srcUrl(),{cache:'no-store'});
    if(!r.ok) throw new Error('HTTP '+r.status);
    last=await r.json();
    failCount=0;
    const faults=campaignFaults(last);
    if(faults) showBanner(faults); else hideBanner();
    document.getElementById('hdot').style.background='var(--green)';
    const dataAge=Math.max(0,Math.round((Date.now()/1000-last.ts)/60));
    document.getElementById('meta').textContent=
      `updated ${new Date(last.ts*1000).toLocaleTimeString('en-GB')}`
      +(STATIC_MODE&&dataAge>0?` (${dataAge}m ago)`:'')
      +` · auto-refresh ${REFRESH_MS/1000}s`;
    document.getElementById('footer').textContent=
      `svr6 collector · nodes auto-detected from ssh config`
      +(last.scanned?` · run dirs scanned: ${last.scanned.join(', ')}`:'');
    render();
  }catch(e){
    failCount++;
    document.getElementById('meta').textContent='reconnecting…';
    document.getElementById('hdot').style.background='var(--red)';
    if(failCount>=3) showBanner('Live data source is unreachable — the svr6 collector or its publisher may be down. Retrying automatically.');
  }
}
load();
setInterval(load,REFRESH_MS);
</script>
